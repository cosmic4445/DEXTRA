[package]
name = "dextra"
authors = ["cuber"]
version = "0.1.0"
repository = "https://github.com/cosmic4445/DEXTRA/tree/main"
edition = "2021"

[dependencies]
iced = { version = "0.13", features = ["tokio", "image", "svg"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
image = "0.25"
dirs = "5"
opener = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
